<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      // -----------------------------------------------------------------
      // This script takes the current url and redirects the browser
      // to the index page where the query string is decoded and
      // history.replaceState() is called.
      // -----------------------------------------------------------------

      // If you are using a subpath (e.g. username.github.io/repo-name), 
      // set pathSegmentsToKeep to 1 (or more depending on subfolder depth).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathSegments = l.pathname.split('/').slice(1);
      
      var baseSegments = pathSegments.slice(0, pathSegmentsToKeep);
      var targetSegments = pathSegments.slice(pathSegmentsToKeep);

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + baseSegments.join('/') +
        (baseSegments.length > 0 ? '/' : '') +
        '?p=/' + targetSegments.join('/') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
