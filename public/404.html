<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      
      // -----------------------------------------------------------------
      // CONFIGURATION:
      // Set to 1 if your site is hosted at a subpath (e.g. username.github.io/repo-name/)
      // Set to 0 if your site is hosted at a custom domain or root (e.g. username.github.io/)
      var pathSegmentsToKeep = 0; 
      // -----------------------------------------------------------------

      var l = window.location;
      var pathSegments = l.pathname.split('/').slice(1);
      var baseSegments = pathSegments.slice(0, pathSegmentsToKeep);
      var targetSegments = pathSegments.slice(pathSegmentsToKeep);

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + baseSegments.join('/') +
        (baseSegments.length > 0 ? '/' : '') +
        '?p=/' + targetSegments.join('/') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
