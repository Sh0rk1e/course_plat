name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VIDEO_PROVIDER: ${{ vars.VITE_VIDEO_PROVIDER }}
          VIDEO_TOKEN_ENDPOINT: ${{ vars.VITE_VIDEO_TOKEN_ENDPOINT }}
        run: |
          cat > .env.production <<EOF
          VITE_FIREBASE_API_KEY=${FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
          VITE_FIREBASE_APP_ID=${FIREBASE_APP_ID}
          VITE_VIDEO_PROVIDER=${VIDEO_PROVIDER:-youtube}
          VITE_VIDEO_TOKEN_ENDPOINT=${VIDEO_TOKEN_ENDPOINT}
          EOF

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
